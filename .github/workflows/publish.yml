name: Publish Package

# Security model
# --------------
# - Authenticates via OIDC TRUSTED PUBLISHING — no npm token exists. The job mints
#   a short-lived, workflow-scoped OIDC credential; nothing long-lived to leak or
#   rotate. Configure the trusted publisher on npmjs.com (package repo2pdf →
#   Trusted Publishing → GitHub Actions, repo BankkRoll/repo2pdf, workflow
#   publish.yml).
# - Provenance is automatic with trusted publishing (verifiable supply chain).
# - Hard guard: the job runs only on the canonical repo, never on forks.
# - Auto-publishes on a v*.*.* tag push, or via manual dispatch.
# - Verifies the tag / input version matches package.json before publishing, and
#   refuses to republish a version that already exists on npm.
# - Least-privilege permissions; third-party actions are pinned by commit SHA.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish (e.g., v2.3.0)"
        required: true

# contents: read to checkout, id-token: write to mint the OIDC credential npm
# uses for trusted publishing. No other scopes are granted.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    # Run only on the canonical repo (defense-in-depth vs. forks) and only for a
    # tag push or a manual dispatch.
    if: >-
      github.repository == 'BankkRoll/repo2pdf' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1; pin a current npm explicitly.
      - name: Update npm (OIDC trusted publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Verify tag matches package version
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::Release tag is required." >&2
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PACKAGE_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::Version mismatch: package.json=${PACKAGE_VERSION}, tag=${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Verify version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION already exists on npm. Bump the version in package.json." >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN: auth is via OIDC trusted publishing. npm reads the
      # id-token minted by `id-token: write` above. Provenance is automatic.
      - name: Publish to npm (trusted publishing, public)
        run: npm publish --access public
